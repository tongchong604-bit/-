<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图文参考素材库</title><link rel="stylesheet" href="style.css"></head><body><main><span class="eyebrow">本地图文参考库 · WIN7 / CHROME</span><h1>收集参考，再开始创作</h1><p>建议每次选 3～5 篇。原图不压缩，ZIP 按 20 MB 分包；导出时请保持此页面打开。</p><div class="toolbar"><button id="select-all">全选</button><button id="export" class="primary">生成所选 ZIP</button><button id="clear" class="danger">清空记录</button><span id="summary" class="muted"></span></div><div id="status" class="status" role="status" aria-live="polite"></div><div id="downloads"></div><div id="list"></div><footer>素材只保存在当前浏览器。采集保存的是图片地址；导出才下载原图，地址可能过期，请及时导出。每包都附正文目录与导出报告。仅供学习参考，发布他人图片前需确认使用授权。<br>Chrome109 兼容设计，真实抖音布局可能变化；提示无法读取时请保留原链接并反馈。</footer></main><script type="module" src="library.js"></script></body></html>
